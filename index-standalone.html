<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTINEL // Secure Coding Assistant</title>
  <meta name="description" content="Editorial-grade real-time security analysis assistant with instant AST triage, OWASP Top 10 detection, live exploit simulation, and automated defense-in-depth patches.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #09090B;
      --bg-surface: #111114;
      --bg-elevated: #18181B;
      --bg-hover: #202024;
      --border: #27272A;
      --border-subtle: #1C1C1F;
      --accent: #14B8A6;
      --accent-dim: rgba(20, 184, 166, 0.12);
      --text-primary: #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-muted: #52525B;
      --text-code: #D4D4D8;
      --critical: #EF4444;
      --high: #F97316;
      --medium: #EAB308;
      --success: #22C55E;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #27272A; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #3F3F46; }

    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .logo { display: flex; align-items: center; gap: 1rem; }
    .logo-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, #0D9488 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 24px; height: 24px; color: white; }
    .logo-text h1 { font-size: 1.25rem; font-weight: 700; }
    .logo-text p { font-size: 0.75rem; color: var(--text-muted); }

    /* Card */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .card-title { display: flex; align-items: center; gap: 0.75rem; }
    .card-title-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--accent-dim);
      display: flex; align-items: center; justify-content: center;
    }
    .card-title-icon svg { width: 20px; height: 20px; color: var(--accent); }
    .card-title h2 { font-size: 1rem; font-weight: 600; }
    .card-title p { font-size: 0.75rem; color: var(--text-muted); }

    /* Login Form */
    .login-section { padding: 2rem; max-width: 400px; margin: 0 auto; }
    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 150ms;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--text-muted); }

    .btn {
      width: 100%;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 150ms;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #0D9488; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-google { background: white; color: #333; border: 1px solid #ddd; }
    .btn-google:hover { background: #f5f5f5; }
    .btn-secondary { background: var(--bg-hover); color: var(--text-secondary); }
    .btn-secondary:hover { background: var(--border); }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Error/Success Messages */
    .message {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .message-error { background: rgba(239, 68, 68, 0.1); color: var(--critical); border: 1px solid rgba(239, 68, 68, 0.2); }
    .message-success { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.2); }
    .message svg { width: 18px; height: 18px; }

    /* Project Manager */
    .projects-section { padding: 1.5rem; }
    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .project-card {
      padding: 1.25rem;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 150ms;
    }
    .project-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .project-card h3 { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
    .project-card p { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.75rem; }
    .project-meta { display: flex; gap: 1rem; font-size: 0.6875rem; color: var(--text-muted); }
    .project-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .project-actions .btn { width: auto; padding: 0.5rem 1rem; font-size: 0.75rem; }

    .create-project-card {
      border: 2px dashed var(--border);
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      color: var(--text-muted);
    }
    .create-project-card:hover { border-color: var(--accent); color: var(--accent); }
    .create-project-card svg { width: 32px; height: 32px; margin-bottom: 0.5rem; }
    .create-project-card span { font-size: 0.875rem; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; max-width: 480px; width: 100%; }
    .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-header h2 { font-size: 1rem; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.5rem; }
    .modal-close:hover { color: var(--text-primary); }
    .modal-body { padding: 1.5rem; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.75rem; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.875rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 300ms;
      z-index: 200;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--success); }
    .toast.success svg { color: var(--success); }
    .toast svg { width: 18px; height: 18px; }

    /* Loading Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* User Badge */
    .user-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      background: var(--bg-elevated);
      font-size: 0.875rem;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.75rem;
    }
    .user-name { font-weight: 500; }
    .logout-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      margin-left: 0.5rem;
    }
    .logout-btn:hover { color: var(--critical); }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .login-section { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>SENTINEL</h1>
          <p>Secure Coding Assistant</p>
        </div>
      </div>
      <div id="user-area"></div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Login Section (shown when not logged in) -->
      <div id="login-section" class="card">
        <div class="login-section">
          <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Sign in to access your projects</p>
          </div>

          <div id="error-message" class="message message-error" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" x2="12" y1="8" y2="12"/>
              <line x1="12" x2="12.01" y1="16" y2="16"/>
            </svg>
            <span id="error-text"></span>
          </div>

          <div id="success-message" class="message message-success" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span id="success-text"></span>
          </div>

          <!-- Google Sign In -->
          <button id="google-signin-btn" class="btn btn-google">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
          </button>

          <div class="divider">or</div>

          <!-- Email/Password Form -->
          <form id="login-form">
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary">
              <span id="submit-text">Sign In</span>
              <div id="submit-spinner" class="spinner" style="display: none;"></div>
            </button>
          </form>

          <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
            Don't have an account? <a href="#" id="toggle-auth" style="color: var(--accent); text-decoration: none;">Create one</a>
          </div>
        </div>
      </div>

      <!-- Projects Section (shown when logged in) -->
      <div id="projects-section" class="card" style="display: none;">
        <div class="card-header">
          <div class="card-title">
            <div class="card-title-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <div>
              <h2>My Projects</h2>
              <p id="projects-count">0 projects · 0 files</p>
            </div>
          </div>
          <button id="new-project-btn" class="btn btn-primary" style="width: auto; padding: 0.5rem 1rem;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <path d="M5 12h14M12 5v14"/>
            </svg>
            New Project
          </button>
        </div>
        <div class="projects-section">
          <div class="project-grid" id="projects-grid">
            <!-- Projects will be rendered here -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Project Modal -->
  <div id="create-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h2>Create New Project</h2>
        <button class="modal-close" onclick="closeCreateModal()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Project Name</label>
          <input type="text" id="project-name" class="form-input" placeholder="My Awesome Project">
        </div>
        <div class="form-group">
          <label class="form-label">Description (optional)</label>
          <input type="text" id="project-desc" class="form-input" placeholder="What does this project do?">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" style="width: auto; padding: 0.5rem 1rem;" onclick="closeCreateModal()">Cancel</button>
        <button id="create-project-submit" class="btn btn-primary" style="width: auto; padding: 0.5rem 1rem;" onclick="createProject()">Create Project</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span id="toast-text"></span>
  </div>

  <script>
    // Firebase Configuration
    // Replace with your Firebase project config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // State
    let currentUser = null;
    let isSignUp = false;
    let projects = [];
    let firebaseInitialized = false;
    let firebaseAuth = null;

    // Auth Error Messages
    const AUTH_ERRORS = {
      'auth/email-already-in-use': 'This email is already registered. Try signing in instead.',
      'auth/invalid-email': 'Please enter a valid email address.',
      'auth/operation-not-allowed': 'This sign-in method is not enabled.',
      'auth/weak-password': 'Password should be at least 6 characters.',
      'auth/user-disabled': 'This account has been disabled.',
      'auth/user-not-found': 'No account found with this email.',
      'auth/wrong-password': 'Incorrect password. Please try again.',
      'auth/invalid-credential': 'Invalid email or password.',
      'auth/too-many-requests': 'Too many attempts. Please try again later.',
      'auth/network-request-failed': 'Network error. Please check your connection.',
      'auth/popup-closed-by-user': 'Sign-in popup was closed.',
      'auth/cancelled-popup-request': 'Sign-in was cancelled.',
      'auth/popup-blocked': 'Popup was blocked. Please allow popups.',
    };

    // Initialize Firebase
    async function initFirebase() {
      if (firebaseInitialized) return;
      
      // Check if already logged in
      const savedUser = localStorage.getItem('sentinel_user');
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          showProjectsSection();
          return;
        } catch (e) {
          localStorage.removeItem('sentinel_user');
        }
      }
      
      // Load Firebase SDK
      if (!window.firebase) {
        const script1 = document.createElement('script');
        script1.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js';
        document.head.appendChild(script1);
        
        await new Promise((resolve) => { script1.onload = resolve; });
        
        const script2 = document.createElement('script');
        script2.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js';
        document.head.appendChild(script2);
        
        await new Promise((resolve) => { script2.onload = resolve; });
      }
      
      try {
        window.firebase.initializeApp(firebaseConfig);
        firebaseAuth = window.firebase.auth();
        firebaseInitialized = true;
        
        // Listen for auth state changes
        firebaseAuth.onAuthStateChanged((user) => {
          if (user) {
            currentUser = {
              uid: user.uid,
              email: user.email,
              displayName: user.displayName,
              photoURL: user.photoURL
            };
            localStorage.setItem('sentinel_user', JSON.stringify(currentUser));
            showProjectsSection();
          } else {
            currentUser = null;
            localStorage.removeItem('sentinel_user');
            showLoginSection();
          }
        });
      } catch (error) {
        console.log('Firebase not configured. Using local storage for demo.');
        showLoginSection();
      }
    }

    // Show/Hide Sections
    function showLoginSection() {
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('projects-section').style.display = 'none';
      document.getElementById('user-area').innerHTML = '';
    }

    function showProjectsSection() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('projects-section').style.display = 'block';
      renderUserBadge();
      loadProjects();
    }

    function renderUserBadge() {
      const initial = currentUser.displayName ? currentUser.displayName[0].toUpperCase() : 
                      currentUser.email ? currentUser.email[0].toUpperCase() : 'U';
      document.getElementById('user-area').innerHTML = `
        <div class="user-badge">
          <div class="user-avatar">${initial}</div>
          <span class="user-name">${currentUser.displayName || currentUser.email}</span>
          <button class="logout-btn" onclick="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" x2="9" y1="12" y2="12"/>
            </svg>
          </button>
        </div>
      `;
    }

    // Show Error/Success Messages
    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      document.getElementById('error-text').textContent = message;
      errorDiv.style.display = 'flex';
      document.getElementById('success-message').style.display = 'none';
    }

    function showSuccess(message) {
      const successDiv = document.getElementById('success-message');
      document.getElementById('success-text').textContent = message;
      successDiv.style.display = 'flex';
      document.getElementById('error-message').style.display = 'none';
    }

    function clearMessages() {
      document.getElementById('error-message').style.display = 'none';
      document.getElementById('success-message').style.display = 'none';
    }

    // Toast Notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = message;
      toast.classList.add('show', 'success');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Google Sign In
    async function signInWithGoogle() {
      if (!firebaseInitialized) {
        showError('Firebase is not configured. Please contact the administrator.');
        return;
      }

      clearMessages();
      const btn = document.getElementById('google-signin-btn');
      btn.disabled = true;

      try {
        const provider = new window.firebase.auth.GoogleAuthProvider();
        await firebaseAuth.signInWithPopup(provider);
      } catch (error) {
        const message = AUTH_ERRORS[error.code] || 'Sign-in failed. Please try again.';
        showError(message);
        btn.disabled = false;
      }
    }

    // Email/Password Auth
    async function handleAuthSubmit(e) {
      e.preventDefault();
      clearMessages();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');
      const submitText = document.getElementById('submit-text');
      const submitSpinner = document.getElementById('submit-spinner');

      submitBtn.disabled = true;
      submitText.textContent = isSignUp ? 'Creating account...' : 'Signing in...';
      submitSpinner.style.display = 'block';

      try {
        if (isSignUp) {
          if (!firebaseInitialized) {
            // Demo mode - create local account
            const user = { uid: Date.now().toString(), email, displayName: email.split('@')[0] };
            currentUser = user;
            localStorage.setItem('sentinel_user', JSON.stringify(user));
            showSuccess('Account created successfully!');
            setTimeout(showProjectsSection, 1000);
          } else {
            await firebaseAuth.createUserWithEmailAndPassword(email, password);
            showSuccess('Account created successfully!');
          }
        } else {
          if (!firebaseInitialized) {
            // Demo mode - check local storage
            const saved = localStorage.getItem('sentinel_user_demo');
            if (saved) {
              const user = JSON.parse(saved);
              if (user.email === email) {
                currentUser = user;
                localStorage.setItem('sentinel_user', JSON.stringify(user));
                showProjectsSection();
              } else {
                showError('Invalid email or password.');
              }
            } else {
              // Create demo account
              const user = { uid: Date.now().toString(), email, displayName: email.split('@')[0] };
              localStorage.setItem('sentinel_user_demo', JSON.stringify(user));
              currentUser = user;
              localStorage.setItem('sentinel_user', JSON.stringify(user));
              showSuccess('Demo account created. Welcome!');
              setTimeout(showProjectsSection, 1000);
            }
          } else {
            await firebaseAuth.signInWithEmailAndPassword(email, password);
          }
        }
      } catch (error) {
        const message = AUTH_ERRORS[error.code] || error.message || 'Authentication failed.';
        showError(message);
      } finally {
        submitBtn.disabled = false;
        submitText.textContent = isSignUp ? 'Create Account' : 'Sign In';
        submitSpinner.style.display = 'none';
      }
    }

    // Toggle Sign In/Sign Up
    function toggleAuthMode() {
      isSignUp = !isSignUp;
      clearMessages();
      document.getElementById('submit-text').textContent = isSignUp ? 'Create Account' : 'Sign In';
      document.querySelector('#login-form .form-label:first-of-type').textContent = isSignUp ? 'Email' : 'Email';
      document.querySelector('#login-form .form-group:last-of-type .form-label').textContent = isSignUp ? 'Password (min 6 characters)' : 'Password';
      document.getElementById('toggle-auth').textContent = isSignUp ? 'Sign in' : 'Create one';
      document.querySelector('.login-section h2').textContent = isSignUp ? 'Create Account' : 'Welcome Back';
      document.querySelector('.login-section p').textContent = isSignUp ? 'Get started with your free account' : 'Sign in to access your projects';
    }

    // Logout
    async function logout() {
      if (firebaseInitialized) {
        await firebaseAuth.signOut();
      }
      currentUser = null;
      localStorage.removeItem('sentinel_user');
      localStorage.removeItem('sentinel_user_demo');
      showLoginSection();
      showToast('Signed out successfully');
    }

    // Projects Management
    function loadProjects() {
      const saved = localStorage.getItem('sentinel_projects');
      projects = saved ? JSON.parse(saved) : [];
      renderProjects();
    }

    function saveProjects() {
      localStorage.setItem('sentinel_projects', JSON.stringify(projects));
    }

    function renderProjects() {
      const grid = document.getElementById('projects-grid');
      const totalFiles = projects.reduce((acc, p) => acc + (p.files?.length || 0), 0);
      document.getElementById('projects-count').textContent = `${projects.length} projects · ${totalFiles} files`;

      let html = projects.map(p => `
        <div class="project-card" onclick="openProject('${p.id}')">
          <h3>${p.name}</h3>
          <p>${p.description || 'No description'}</p>
          <div class="project-meta">
            <span>${p.files?.length || 0} files</span>
            <span>${new Date(p.createdAt).toLocaleDateString()}</span>
          </div>
          <div class="project-actions">
            <button class="btn btn-secondary" onclick="event.stopPropagation(); downloadProject('${p.id}')">
              Download
            </button>
            <button class="btn btn-secondary" onclick="event.stopPropagation(); deleteProject('${p.id}')" style="color: var(--critical);">
              Delete
            </button>
          </div>
        </div>
      `).join('');

      // Add "Create New" card
      html += `
        <div class="project-card create-project-card" onclick="openCreateModal()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5v14"/>
          </svg>
          <span>Create New Project</span>
        </div>
      `;

      grid.innerHTML = html;
    }

    function openCreateModal() {
      document.getElementById('create-modal').style.display = 'flex';
      document.getElementById('project-name').value = '';
      document.getElementById('project-desc').value = '';
      document.getElementById('project-name').focus();
    }

    function closeCreateModal() {
      document.getElementById('create-modal').style.display = 'none';
    }

    function createProject() {
      const name = document.getElementById('project-name').value.trim();
      const desc = document.getElementById('project-desc').value.trim();

      if (!name) {
        showToast('Please enter a project name');
        return;
      }

      const project = {
        id: `proj_${Date.now()}`,
        name,
        description: desc,
        files: [],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      projects.unshift(project);
      saveProjects();
      renderProjects();
      closeCreateModal();
      showToast('Project created successfully');
    }

    function openProject(projectId) {
      const project = projects.find(p => p.id === projectId);
      if (project) {
        showToast(`Opening ${project.name}...`);
        // In a real app, this would load the project into the editor
        console.log('Project data:', project);
      }
    }

    function downloadProject(projectId) {
      const project = projects.find(p => p.id === projectId);
      if (!project) return;

      const data = JSON.stringify(project, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${project.name}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showToast('Project downloaded');
    }

    function deleteProject(projectId) {
      if (!confirm('Are you sure you want to delete this project?')) return;
      projects = projects.filter(p => p.id !== projectId);
      saveProjects();
      renderProjects();
      showToast('Project deleted');
    }

    // Event Listeners
    document.getElementById('google-signin-btn').addEventListener('click', signInWithGoogle);
    document.getElementById('login-form').addEventListener('submit', handleAuthSubmit);
    document.getElementById('toggle-auth').addEventListener('click', (e) => { e.preventDefault(); toggleAuthMode(); });
    document.getElementById('new-project-btn').addEventListener('click', openCreateModal);

    // Close modal on overlay click
    document.getElementById('create-modal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeCreateModal();
    });

    // Initialize
    initFirebase();
  </script>
</body>
</html>
